services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db-complejo-deportivo
    restart: no
    environment:
      POSTGRES_USER: limber
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: bdcomplejodeportivo
      TZ: America/La_Paz
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limber -d bdcomplejodeportivo"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: sports_pgadmin
    restart: no
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sports.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: sports_backend
    restart: no
    ports:
      - "4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-limber}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-bdcomplejodeportivo}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-before-deployment}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-5173}}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT_HOST:-4000}/api}
    container_name: sports_frontend
    restart: no
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata: